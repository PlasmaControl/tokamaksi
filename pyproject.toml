[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokamaksi"
dynamic = ["version"]
description = "Read the Tokamak-SI DIII-D event labels and plot them on a shot"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6",
  "huggingface_hub>=0.30,<2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
h5 = ["h5py>=3.10"]
test = ["pytest>=8", "ruff"]
# fdp, toksearch and toksearch_d3d are not extras: they come from the conda channel
# `ga-fdp` and are imported lazily (live fetching is milestone 2).

[project.scripts]
tokamaksi = "tokamaksi.cli:main"

[tool.hatch.version]
path = "src/tokamaksi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tokamaksi"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::tokamaksi.errors.TermsWarning"]
markers = [
  "real_release: needs TOKAMAKSI_TEST_RELEASE pointing at a real release directory (never in CI)",
]
